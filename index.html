<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>螢火蟲平台｜遊戲服務接單系統</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,"Noto Sans TC",sans-serif;background:#08131d;color:#e9fff4}header{background:#10242b;padding:18px max(5%,calc((100% - 1060px)/2));border-bottom:1px solid #24433e;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:850;color:#8cf4b0}main{max-width:1060px;margin:32px auto;padding:0 16px}.hero{text-align:center;margin-bottom:22px}.hero h1{font-size:30px;margin-bottom:5px}.muted{color:#9bb6ae;font-size:13px}.panel{background:#10242b;border:1px solid #315e50;border-radius:23px;padding:28px;margin:16px 0;box-shadow:0 12px 36px #0005}.auth{max-width:480px;margin:25px auto}h2{font-size:21px;margin:0 0 17px}label{display:block;margin:15px 0 6px;font-weight:600}input,select,textarea{width:100%;border:1px solid #3a615a;border-radius:12px;padding:13px 14px;background:white;font:inherit;color:#e9fff4}textarea{min-height:90px}button{cursor:pointer;border:0;border-radius:13px;padding:12px 18px;font:inherit;font-weight:700}.primary{background:linear-gradient(95deg,#78f5a7,#55cf90);color:white;box-shadow:0 12px 20px #78f5a72a}.wide{width:100%;margin-top:18px}.outline{background:#193630;color:#8af5b2}.links{text-align:center;margin:18px}.links button{background:none;color:#8af5b2;padding:5px}.divider{display:flex;align-items:center;gap:10px;color:#9bb6ae;font-size:12px;margin:25px 0 16px}.divider:before,.divider:after{content:"";height:1px;background:#315e50;flex:1}.notice{background:#08131d;border-radius:15px;padding:14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.8}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{background:white;color:#b7cfc8;border:1px solid #315e50}.nav .active{background:#78f5a7;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{background:#10242b;padding:20px;border-radius:15px;border:1px solid #315e50}.stat b{display:block;color:#8cf4b0;font-size:26px}.item{background:white;border:1px solid #315e50;border-radius:14px;padding:16px;margin:12px 0}.item p{white-space:pre-wrap;overflow-wrap:anywhere}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hide{display:none!important}.status{font-size:12px;background:#193630;color:#b9ead0;border-radius:15px;padding:4px 10px}.error{color:#ffafa0;white-space:pre-wrap}.success{color:#86efac;white-space:pre-wrap}@media(max-width:600px){.panel{padding:19px}.hero h1{font-size:25px}}footer{text-align:center;color:#789b8e;padding:25px}
body{background:radial-gradient(circle at 15% 15%,#164a44 0,transparent 40%),#08131d}header{background:#081a22}.panel,.stat,.item{background:#10242b}.primary{color:#08241a}.nav .active{color:#08241a}input,select,textarea{background:#071a21;color:#e9fff4}.notice{background:#193630;border:1px solid #3b7158}.status{color:#b9ead0}
</style></head><body>
<header><div class="brand">✦ 螢火蟲平台</div><div id="who" class="muted">遊戲服務接單系統</div></header><main><div class="hero"><h1>讓你的遊戲實力，變成更多可能</h1><div class="muted">玩家下單 · 打手接單 · 管理員審核</div></div>
<section id="setup" class="panel auth hide"><h2>平台尚未連接資料庫</h2><p>請先按照 ZIP 內的「部署說明.md」完成 Supabase 設定，並填入 <code>config.js</code>。</p></section>
<section id="auth" class="panel auth hide"><h2 id="authTitle">歡迎回來</h2><div class="muted">登入螢火蟲服務平台</div><form id="authForm"><div id="nameRow" class="hide"><label>顯示名稱</label><input id="displayName" maxlength="80"></div><label>電子郵件</label><input id="email" type="email" autocomplete="email" required placeholder="請輸入電子郵件"><label>密碼</label><input id="password" type="password" minlength="8" required placeholder="至少 8 個字元"><label class="row" style="font-weight:400"><input id="showPwd" type="checkbox" style="width:auto">顯示密碼</label><button class="primary wide" id="submitAuth">登入</button></form><div class="links"><span id="switchLabel">僅限管理員建立的帳號登入</span><button id="switchAuth" class="hide">立即註冊</button></div><div class="divider">螢火蟲平台</div><div class="notice"><span>🛡️</span><div>平台帳號採審核制，僅提供已通過審核之接單人員使用。<div class="muted">本平台不開放自行註冊，帳號由管理員建立；接單資格須經審核。</div></div></div></section>
<section id="app" class="hide"><div class="row"><h2 id="greeting" style="margin:0"></h2><button class="outline" id="logout" style="margin-left:auto">登出</button></div><div class="nav" id="nav"></div><div id="content"></div></section>
<p id="message" role="status"></p></main><footer>© 2026 螢火蟲遊戲服務平台</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./config.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const cfg=window.FIREFLY_CONFIG||{};if(!cfg.url||!cfg.anonKey||cfg.url.includes('YOUR_')){$('setup').classList.remove('hide');return}
const sb=supabase.createClient(cfg.url,cfg.anonKey);let user=null,profile=null,tab='home',register=false,adminRole=null;
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));
const msg=(v,bad=false)=>{$('message').textContent=v||'';$('message').className=bad?'error':'success'};
async function req(p){const {data,error}=await p;if(error)throw error;return data}
async function refresh(){let {data:{user:u}}=await sb.auth.getUser();user=u;if(!u){$('auth').classList.remove('hide');$('app').classList.add('hide');return}
profile=await req(sb.from('profiles').select('*').eq('id',u.id).single());const roleResult=await sb.from('user_roles').select('role').eq('user_id',u.id).maybeSingle();adminRole=roleResult.error?null:roleResult.data?.role;const isAdmin=adminRole==='super_admin'||adminRole==='admin';if(isAdmin)profile.role='admin';$('auth').classList.add('hide');$('app').classList.remove('hide');$('greeting').textContent='您好，'+(profile.display_name||u.email)+' · '+({player:'玩家',worker:'接單人員',admin:'管理員'}[profile.role]);$('who').textContent=u.email;await render()}
function setAuth(){ $('authTitle').textContent=register?'建立帳號':'歡迎回來';$('submitAuth').textContent=register?'註冊帳號':'登入';$('switchLabel').textContent=register?'已有帳號？':'沒有帳號？';$('switchAuth').textContent=register?'返回登入':'立即註冊';$('nameRow').classList.toggle('hide',!register)}
$('switchAuth').onclick=()=>{register=false;setAuth();msg('')};$('showPwd').onchange=e=>$('password').type=e.target.checked?'text':'password';
$('authForm').onsubmit=async e=>{e.preventDefault();try{let email=$('email').value.trim(),password=$('password').value;{await req(sb.auth.signInWithPassword({email,password}));msg('');await refresh()}}catch(err){msg(err.message,true)}};
$('logout').onclick=async()=>{await sb.auth.signOut();user=null;profile=null;msg('已登出');await refresh()};
function button(label,action,id,primary=false){return `<button class="${primary?'primary':'outline'}" data-action="${action}" data-id="${escapeHtml(id)}">${label}</button>`}
function orderItem(x){return `<div class="item"><div class="row"><strong>${escapeHtml(x.game)}｜${escapeHtml(x.service)}</strong><span class="status">${escapeHtml(x.status)}</span></div><p>${escapeHtml(x.details)}</p><div class="muted">訂單 ${escapeHtml(x.id.slice(0,8))} · 預算 NT$ ${Number(x.budget).toLocaleString('zh-TW')} · ${new Date(x.created_at).toLocaleDateString('zh-TW')}</div><div class="row" style="margin-top:10px">${profile.role==='admin'&&x.status==='pending'?button('核准','approveOrder',x.id,true)+button('拒絕','rejectOrder',x.id):''}${profile.role==='worker'&&x.status==='open'?button('接單','claim',x.id,true):''}${profile.role==='worker'&&x.status==='active'&&x.worker_id===user.id?button('標記完成','finish',x.id,true):''}</div></div>`}
async function render(){const items=[['home','總覽'],['orders','訂單']];if(profile.role==='player')items.push(['create','建立訂單'],['apply','申請接單資格']);if(profile.role==='admin')items.push(['applications','審核打手'],['management','會員管理']);$('nav').innerHTML=items.map(([id,name])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${name}</button>`).join('');const box=$('content');box.innerHTML='<div class="panel">載入中…</div>';try{
if(tab==='home'){let orders=await req(sb.from('orders').select('id,status,budget'));box.innerHTML=`<div class="grid"><div class="stat">可查看訂單<b>${orders.length}</b></div><div class="stat">待處理<b>${orders.filter(o=>['pending','open'].includes(o.status)).length}</b></div><div class="stat">已完成<b>${orders.filter(o=>o.status==='completed').length}</b></div></div><div class="panel"><h2>服務流程</h2><p>玩家建立訂單 → 管理員審核 → 合格接單人員承接 → 完成服務。</p><p class="muted">訂單金額為預算，不代表已付款或已結算收入。本系統尚未整合金流。</p></div>`}
else if(tab==='orders'){let orders=await req(sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100));box.innerHTML=`<div class="panel"><h2>${profile.role==='worker'?'接單大廳與我的任務':'訂單管理'}</h2>${orders.length?orders.map(orderItem).join(''):'目前沒有訂單'}</div>`}
else if(tab==='create'){box.innerHTML=`<div class="panel"><h2>建立訂單</h2><form id="newOrder"><label>遊戲名稱</label><input name="game" maxlength="100" required><label>服務類型</label><select name="service"><option>代練</option><option>陪玩</option><option>任務協助</option><option>段位提升</option></select><label>預算（NT$）</label><input name="budget" type="number" min="1" max="999999" step="1" required><label>服務需求</label><textarea name="details" maxlength="2000" required></textarea><button class="primary wide">送出訂單</button></form></div>`}
else if(tab==='apply'){let a=await req(sb.from('worker_applications').select('*').eq('applicant_id',user.id).maybeSingle());box.innerHTML=a?`<div class="panel"><h2>接單資格申請</h2><p>目前審核狀態：<strong>${escapeHtml(a.status)}</strong></p></div>`:`<div class="panel"><h2>申請接單資格</h2><form id="workerForm"><label>擅長遊戲</label><input name="game" maxlength="100" required><label>經驗與可接單時間</label><textarea name="experience" maxlength="2000" required></textarea><button class="primary wide">送出審核</button></form></div>`}
else if(tab==='management'){if(adminRole!=='super_admin'){box.innerHTML='<div class="panel"><h2>會員管理</h2><p>只有最高管理員可以建立會員。</p></div>'}else{box.innerHTML=`<div class="panel"><h2>會員管理｜新增會員</h2><p class="muted">僅最高管理員可以建立帳號；會員建立後可使用電子郵件及初始密碼登入。請透過安全管道交付密碼，並要求會員立即更換。</p><form id="createMember"><label>會員電子郵件</label><input name="email" type="email" autocomplete="off" maxlength="254" placeholder="member@example.com" required><label>初始密碼（至少 12 個字元）</label><input name="password" type="password" autocomplete="new-password" minlength="12" required><button class="primary wide" id="createMemberButton">建立會員帳號</button></form><p id="memberResult" role="status" class="muted"></p><div class="notice">建立會員的操作由 Supabase Edge Function 驗證最高管理員身分。此頁不會儲存管理員密鑰。</div></div>`}}
else if(tab==='applications'){let a=await req(sb.from('worker_applications').select('*').order('created_at',{ascending:false}));box.innerHTML=`<div class="panel"><h2>接單人員審核</h2>${a.length?a.map(x=>`<div class="item"><strong>${escapeHtml(x.game)}</strong> <span class="status">${escapeHtml(x.status)}</span><p>${escapeHtml(x.experience)}</p><div class="muted">申請人 ID：${escapeHtml(x.applicant_id)}</div><div class="row">${x.status==='pending'?button('核准','approveApp',x.id,true)+button('拒絕','rejectApp',x.id):''}</div></div>`).join(''):'目前沒有申請'}</div>`}
}catch(e){box.textContent='資料載入失敗：'+e.message;msg(e.message,true)}}
$('nav').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};
$('content').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);if(e.target.id==='newOrder'){await req(sb.from('orders').insert({customer_id:user.id,game:f.get('game'),service:f.get('service'),budget:Number(f.get('budget')),details:f.get('details')}));tab='orders';msg('訂單已送出，等待管理員審核')}if(e.target.id==='workerForm'){await req(sb.from('worker_applications').insert({applicant_id:user.id,game:f.get('game'),experience:f.get('experience')}));msg('接單資格申請已送出')}if(e.target.id==='createMember'){if(adminRole!=='super_admin')throw Error('只有最高管理員可建立會員');const submit=$('createMemberButton'),result=$('memberResult');submit.disabled=true;submit.textContent='建立中…';result.textContent='';try{const {data,error}=await sb.functions.invoke('admin-create-user',{body:{email:String(f.get('email')).trim(),password:String(f.get('password'))}});if(error){let detail='';try{const response=error.context;if(response&&typeof response.json==='function'){const body=await response.json();detail=body.error||body.message||''}}catch{}throw Error(detail||error.message)}if(!data?.success)throw Error(data?.error||'新增會員未成功');e.target.reset();result.className='success';result.textContent='會員建立成功：'+String(f.get('email')).trim()+'。請確認會員資料及角色已同步。';msg('會員帳號建立成功')}finally{submit.disabled=false;submit.textContent='建立會員帳號'}return}await render()}catch(err){msg(err.message,true)}};
$('content').onclick=async e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;if(!confirm('確定執行此操作？'))return;try{let fn,params;if(a==='approveApp'||a==='rejectApp'){fn='review_application';params={p_id:id,p_approve:a==='approveApp'}}else if(a==='approveOrder'||a==='rejectOrder'){fn='review_order';params={p_id:id,p_approve:a==='approveOrder'}}else if(a==='claim'){fn='claim_order';params={p_id:id}}else if(a==='finish'){fn='finish_order';params={p_id:id}}else return;await req(sb.rpc(fn,params));msg('操作完成');await refresh()}catch(err){msg(err.message,true)}};
sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')refresh()});refresh().catch(e=>msg(e.message,true));
})();
</script></body></html>
